name: Generar Gameplay Slither

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias Python
        run: pip install flask pillow

      - name: Generar videos
        run: python gameplay_slither.py
        env:
          RUN_MODE: github

      - name: Subir videos como artifact
        uses: actions/upload-artifact@v4
        with:
          name: gameplay-videos-${{ github.run_number }}
          path: ~/gameplay_slither/gameplay_final_*.mp4
          retention-days: 7
