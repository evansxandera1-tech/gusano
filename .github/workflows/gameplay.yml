name: Generar Gameplay Slither

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar dependencias Python
        run: pip install flask pillow

      - name: Generar videos
        run: python gameplay_slither.py
        env:
          RUN_MODE: github

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Subir videos a Drive
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" > ~/.config/rclone/rclone.conf
          rclone copy ~/gameplay_slither/ gdrive:gameplay_videos --include "gameplay_final_*.mp4"
